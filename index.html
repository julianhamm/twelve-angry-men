<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Twelve Angry Men</title>

<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fffdf8;
    --ink: #24211d;
    --muted: #777169;
    --line: #d9d3ca;
    --accent: #8b2e2e;
    --chip: #e8e3da;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  button {
    font: inherit;
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(244,241,234,.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }

  .top-inner,
  main {
    width: min(100%, 760px);
    margin: auto;
  }

  .title-row {
    min-height: 54px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 6px;
  }

  h1 {
    font-size: 18px;
    letter-spacing: .08em;
    margin: 0;
    flex: 1;
  }

  .back {
    display: none;
    border: 0;
    background: transparent;
    padding: 6px 4px;
    font-weight: 700;
    cursor: pointer;
  }

  .back.show {
    display: block;
  }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 14px 10px;
  }

  .chips::-webkit-scrollbar {
    display: none;
  }

  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 10px;
    min-width: 38px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .chip.active {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }

  main {
    padding: 14px;
  }

  .beat-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: opacity .15s ease, transform .15s ease;
  }

  .beat-card:active {
    transform: scale(.995);
  }

  .beat-card.dimmed {
    opacity: .28;
  }

  .beat-number {
    color: var(--accent);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .beat-meta {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .beat-title {
    margin: 0 0 6px;
    font-size: 19px;
    line-height: 1.18;
  }

  .beat-summary {
    margin: 0 0 12px;
    color: #504b45;
    font-size: 14px;
    line-height: 1.42;
  }

  .participation {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 3px;
  }

  .part {
    position: relative;
    height: 30px;
    border-radius: 5px;
    background: #ebe7e0;
    overflow: hidden;
    display: grid;
    place-items: center;
    color: #aaa39a;
    font-size: 10px;
    font-weight: 800;
  }

  .part .fill {
    position: absolute;
    inset: auto 0 0;
    background: var(--accent);
    opacity: .18;
  }

  .part.present {
    color: var(--ink);
  }

  .part.selected {
    outline: 2px solid var(--ink);
    outline-offset: -2px;
  }

  .part span {
    position: relative;
    z-index: 1;
  }

  .script-head {
    padding: 4px 2px 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }

  .script-head h2 {
    margin: 0 0 6px;
    font-size: 23px;
  }

  .script-head p {
    margin: 0;
    color: var(--muted);
    line-height: 1.4;
  }

  .speech {
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    border-radius: 8px;
  }

  .speech.mine {
    background: #f1e1df;
  }

  .speaker {
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .speech-text {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.48;
  }

  .view-mode {
    display: flex;
    width: fit-content;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: 0 0 14px;
    background: var(--chip);
  }

  .mode-button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .mode-button.active {
    background: var(--ink);
    color: white;
  }

  body.step-active {
    overflow: hidden;
  }

  body.step-active main {
    height: calc(100vh - var(--top-height, 110px));
    padding-top: 0;
    padding-bottom: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body.step-active .mode-chrome {
    position: relative;
    top: auto;
    flex: 0 0 auto;
  }

  .step-view {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .step-bar {
    flex: 0 0 auto;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }

  .mode-chrome {
    position: sticky;
    top: var(--top-height, 110px);
    z-index: 18;
    background: var(--bg);
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }

  .mode-chrome .view-mode {
    margin: 0;
  }

  .step-meta {
    min-width: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .step-meta strong {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .step-speech-area {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-top: 12px;
  }

  .step-speech-area .speech {
    border-bottom: 0;
  }

  .step-controls {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }

  .step-button {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
  }

  .step-button.next {
    text-align: right;
  }

  .step-button:disabled {
    opacity: .35;
    cursor: default;
  }

  .beat-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 24px 0 10px;
  }

  .beat-nav-button {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    box-shadow: var(--shadow);
  }

  .beat-nav-button.next {
    text-align: right;
  }

  .beat-nav-button.empty {
    visibility: hidden;
  }

  .beat-nav-direction {
    display: block;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .beat-nav-title {
    display: block;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.25;
  }

  .character-info {
    flex: 0 0 auto;
    display: none;
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    font-weight: 800;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  .character-info.show {
    display: inline-flex;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,.42);
    padding: 16px;
  }

  .modal-backdrop.show {
    display: flex;
  }

  .modal {
    width: min(100%, 560px);
    background: var(--paper);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.22);
    padding: 18px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .modal h2 {
    margin: 0;
    flex: 1;
    font-size: 22px;
  }

  .modal p {
    margin: 12px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.5;
  }

  .modal-close {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 26px;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
  }

  .status {
    padding: 30px 14px;
    text-align: center;
    color: var(--muted);
  }

  @media (min-width: 700px) {
    main {
      padding-top: 20px;
    }

    .beat-card {
      padding: 18px;
    }

    .beat-title {
      font-size: 21px;
    }

    .beat-summary {
      font-size: 15px;
    }
  }
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">

    <div class="title-row">
      <button id="back" class="back" aria-label="Back to beats">← BEATS</button>
      <h1>TWELVE ANGRY MEN</h1>
      <button id="characterInfo" class="character-info" aria-label="Character information">ⓘ</button>
    </div>

    <nav id="chips" class="chips" aria-label="Character selection"></nav>

  </div>
</header>

<main id="app">
  <div class="status">Loading play…</div>
</main>

<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-top">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="modal-close" aria-label="Close">×</button>
    </div>
    <p id="modalSummary"></p>
  </section>
</div>

<script>

const app = document.getElementById('app');
const chips = document.getElementById('chips');
const back = document.getElementById('back');
const characterInfo = document.getElementById('characterInfo');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalClose = document.getElementById('modalClose');
const modalTitle = document.getElementById('modalTitle');
const modalSummary = document.getElementById('modalSummary');

let data;
let selected = 'ALL';
let currentBeat = null;
let currentSpeech = null;
let scriptMode = 'flow';

const jurors = [
  ['Foreman','F'],
  ['2nd Juror','2'],
  ['3rd Juror','3'],
  ['4th Juror','4'],
  ['5th Juror','5'],
  ['6th Juror','6'],
  ['7th Juror','7'],
  ['8th Juror','8'],
  ['9th Juror','9'],
  ['10th Juror','10'],
  ['11th Juror','11'],
  ['12th Juror','12']
];

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  })[c]);
}

function beatMeta(beat) {

  const act =
    beat.act === 1
      ? 'Act One'
      : 'Act Two';

  const pages =
    beat.start_page === beat.end_page
      ? `Page ${beat.start_page}`
      : `Pages ${beat.start_page}–${beat.end_page}`;

  return `${act} · ${pages}`;
}

function renderChips() {

  const choices = [
    ['ALL','ALL'],
    ...jurors.map(([name,label]) => [
      name,
      name === 'Foreman' ? 'F' : 'J' + label
    ])
  ];

  chips.innerHTML = choices.map(([name,label]) =>
    `<button
      class="chip ${selected === name ? 'active' : ''}"
      data-name="${name}">
      ${label}
    </button>`
  ).join('');

  characterInfo.classList.toggle('show', selected !== 'ALL');

  chips.querySelectorAll('.chip').forEach(btn => {

    btn.addEventListener('click', () => {

      selected = btn.dataset.name;

      renderChips();

      if (currentBeat) {
        scriptMode === 'step' && currentSpeech
          ? renderStepSpeech(currentSpeech)
          : renderScript(currentBeat);
      } else {
        renderBeats();
      }

    });

  });

}

function speechesForBeat(id) {
  return data.script.filter(s => s.beat === id);
}

function countsForBeat(id) {

  const counts =
    Object.fromEntries(
      jurors.map(([name]) => [name, 0])
    );

  for (const speech of speechesForBeat(id)) {

    if (speech.speaker in counts) {
      counts[speech.speaker]++;
    }

  }

  return counts;
}

function renderParticipation(beatId) {

  const counts = countsForBeat(beatId);

  const max =
    Math.max(
      1,
      ...Object.values(counts)
    );

  return `
    <div class="participation">

      ${jurors.map(([name,label]) => {

        const count = counts[name];

        const height =
          count
            ? Math.max(
                18,
                Math.round((count / max) * 100)
              )
            : 0;

        const classes = [
          'part',
          count ? 'present' : '',
          selected === name ? 'selected' : ''
        ]
        .filter(Boolean)
        .join(' ');

        return `
          <div
            class="${classes}"
            title="${escapeHTML(name)}: ${count} speeches">

            <div
              class="fill"
              style="height:${height}%">
            </div>

            <span>${label}</span>

          </div>
        `;

      }).join('')}

    </div>
  `;
}

function renderBeats() {

  currentBeat = null;
  currentSpeech = null;
  document.body.classList.remove('step-active');

  back.classList.remove('show');

  app.innerHTML =
    data.beats.map(beat => {

      const counts =
        countsForBeat(beat.id);

      const dimmed =
        selected !== 'ALL'
        && !counts[selected];

      return `
        <article
          class="beat-card ${dimmed ? 'dimmed' : ''}"
          data-beat="${beat.id}">

          <div class="beat-number">
            Beat ${beat.id}
          </div>

          <div class="beat-meta">
            ${beatMeta(beat)}
          </div>

          <h2 class="beat-title">
            ${escapeHTML(beat.title)}
          </h2>

          <p class="beat-summary">
            ${escapeHTML(beat.summary)}
          </p>

          ${renderParticipation(beat.id)}

        </article>
      `;

    }).join('');

  app.querySelectorAll('.beat-card')
    .forEach(card => {

      card.addEventListener('click', () => {

        const id =
          Number(card.dataset.beat);

        renderScript(id);

        window.scrollTo(0, 0);

      });

    });

}

function updateTopHeight() {
  const top = document.querySelector('.top');
  if (top) {
    document.documentElement.style.setProperty(
      '--top-height',
      `${Math.ceil(top.getBoundingClientRect().height)}px`
    );
  }
}

function renderModeControl() {
  return `
    <div class="view-mode" aria-label="Script navigation mode">
      <button class="mode-button ${scriptMode === 'flow' ? 'active' : ''}" data-mode="flow">Flow</button>
      <button class="mode-button ${scriptMode === 'step' ? 'active' : ''}" data-mode="step">Step</button>
    </div>
  `;
}

function renderModeChrome() {
  return `
    <div class="mode-chrome">
      ${renderModeControl()}
    </div>
  `;
}

function firstSpeechAtTop() {
  const speeches = [...app.querySelectorAll('.speech[data-speech-id]')];
  if (!speeches.length) return null;

  const modeChrome = app.querySelector('.mode-chrome');
  const contentTop = modeChrome
    ? modeChrome.getBoundingClientRect().bottom
    : document.querySelector('.top').getBoundingClientRect().bottom;

  const visible = speeches.find(speech =>
    speech.getBoundingClientRect().bottom > contentTop + 1
  );

  return visible
    ? Number(visible.dataset.speechId)
    : Number(speeches[speeches.length - 1].dataset.speechId);
}

function speechById(id) {
  return data.script.find(speech => speech.id === id);
}

function renderSpeech(speech) {
  return `
    <article data-speech-id="${speech.id}"
      class="speech ${selected !== 'ALL' && speech.speaker === selected ? 'mine' : ''}">
      <div class="speaker">${escapeHTML(speech.speaker)}</div>
      <div class="speech-text">${escapeHTML(speech.text)}</div>
    </article>
  `;
}

function wireModeButtons() {
  app.querySelectorAll('.mode-button').forEach(button => {
    button.addEventListener('click', () => setScriptMode(button.dataset.mode));
  });
}

function setScriptMode(mode) {
  if (!currentBeat || mode === scriptMode) return;

  if (mode === 'step') {
    const speechId = firstSpeechAtTop();
    if (speechId === null) return;
    scriptMode = 'step';
    renderStepSpeech(speechId);
    return;
  }

  const speechId = currentSpeech;
  scriptMode = 'flow';
  document.body.classList.remove('step-active');
  const speech = speechById(speechId);
  renderScript(speech ? speech.beat : currentBeat, speechId);
}

function renderStepSpeech(speechId) {
  const speech = speechById(speechId);
  if (!speech) return;

  currentSpeech = speech.id;
  currentBeat = speech.beat;
  back.classList.add('show');
  document.body.classList.add('step-active');

  const beat = data.beats.find(beat => beat.id === currentBeat);
  const previous = speechById(speech.id - 1);
  const next = speechById(speech.id + 1);

  const pages =
    beat.start_page === beat.end_page
      ? `p.${beat.start_page}`
      : `pp.${beat.start_page}–${beat.end_page}`;

  app.innerHTML = `
    ${renderModeChrome()}

    <section class="step-view">

      <div class="step-bar">
        <div class="step-meta">
          <strong>Beat ${beat.id}</strong>
          · ${escapeHTML(beat.title)}
          · ${pages}
        </div>
      </div>

      <div class="step-speech-area" id="stepSpeechArea">
        ${renderSpeech(speech)}
      </div>

      <nav class="step-controls" aria-label="Speech navigation">
        <button class="step-button" id="stepPrevious" ${previous ? '' : 'disabled'}>
          ← Previous
        </button>
        <button class="step-button next" id="stepNext" ${next ? '' : 'disabled'}>
          Next →
        </button>
      </nav>

    </section>
  `;

  wireModeButtons();

  if (previous) {
    document.getElementById('stepPrevious')
      .addEventListener('click', () => renderStepSpeech(previous.id));
  }

  if (next) {
    document.getElementById('stepNext')
      .addEventListener('click', () => renderStepSpeech(next.id));
  }

  updateTopHeight();
}

function renderBeatNavigation(beatId) {

  const index = data.beats.findIndex(beat => beat.id === beatId);
  const previous = index > 0 ? data.beats[index - 1] : null;
  const next = index < data.beats.length - 1 ? data.beats[index + 1] : null;

  const previousButton = previous
    ? `
      <button class="beat-nav-button" data-beat="${previous.id}">
        <span class="beat-nav-direction">← Previous beat</span>
        <span class="beat-nav-title">${escapeHTML(previous.title)}</span>
      </button>
    `
    : `<div class="beat-nav-button empty" aria-hidden="true"></div>`;

  const nextButton = next
    ? `
      <button class="beat-nav-button next" data-beat="${next.id}">
        <span class="beat-nav-direction">Next beat →</span>
        <span class="beat-nav-title">${escapeHTML(next.title)}</span>
      </button>
    `
    : `<div class="beat-nav-button empty" aria-hidden="true"></div>`;

  return `
    <nav class="beat-nav" aria-label="Beat navigation">
      ${previousButton}
      ${nextButton}
    </nav>
  `;
}

function openCharacterModal() {

  if (selected === 'ALL') return;

  const character = data.characters.find(
    character => character.name === selected
  );

  if (!character) return;

  modalTitle.textContent = character.name;
  modalSummary.textContent = character.summary;
  modalBackdrop.classList.add('show');
  modalBackdrop.setAttribute('aria-hidden', 'false');
}

function closeCharacterModal() {
  modalBackdrop.classList.remove('show');
  modalBackdrop.setAttribute('aria-hidden', 'true');
}

function renderScript(beatId, focusSpeechId = null) {

  currentBeat = beatId;
  back.classList.add('show');

  const beat = data.beats.find(beat => beat.id === beatId);
  const speeches = speechesForBeat(beatId);

  app.innerHTML = `
    ${renderModeChrome()}

    <section class="script-head">
      <div class="beat-number">Beat ${beat.id}</div>
      <div class="beat-meta">${beatMeta(beat)}</div>
      <h2>${escapeHTML(beat.title)}</h2>
      <p>${escapeHTML(beat.summary)}</p>
    </section>

    <section>
      ${speeches.map(renderSpeech).join('')}
    </section>

    ${renderBeatNavigation(beatId)}
  `;

  wireModeButtons();

  app.querySelectorAll('.beat-nav-button[data-beat]').forEach(button => {
    button.addEventListener('click', () => {
      currentSpeech = null;
      renderScript(Number(button.dataset.beat));
      window.scrollTo(0, 0);
    });
  });

  if (focusSpeechId !== null) {
    requestAnimationFrame(() => {
      const speech = app.querySelector(`[data-speech-id="${focusSpeechId}"]`);
      if (speech) {
        currentSpeech = focusSpeechId;

        const topHeader = document.querySelector('.top');
        const modeChrome = app.querySelector('.mode-chrome');
        const offset =
          (topHeader ? topHeader.getBoundingClientRect().height : 0)
          + (modeChrome ? modeChrome.getBoundingClientRect().height : 0)
          + 8;

        const targetY =
          window.scrollY + speech.getBoundingClientRect().top - offset;

        window.scrollTo(0, Math.max(0, targetY));
      }
    });
  }
}

characterInfo.addEventListener('click', openCharacterModal);

modalClose.addEventListener('click', closeCharacterModal);

modalBackdrop.addEventListener('click', event => {
  if (event.target === modalBackdrop) {
    closeCharacterModal();
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closeCharacterModal();
  }
});

let touchStartY = null;
let wheelLocked = false;
let wheelAccumulator = 0;

function moveStep(direction) {
  if (scriptMode !== 'step' || !currentSpeech) return;

  const target = speechById(currentSpeech + direction);
  if (target) renderStepSpeech(target.id);
}

function stepAreaCanScroll(direction) {
  const area = document.getElementById('stepSpeechArea');
  if (!area) return false;

  const tolerance = 2;

  if (direction > 0) {
    return area.scrollTop + area.clientHeight < area.scrollHeight - tolerance;
  }

  return area.scrollTop > tolerance;
}

app.addEventListener('touchstart', event => {
  if (scriptMode === 'step') {
    touchStartY = event.changedTouches[0].clientY;
  }
}, { passive: true });

app.addEventListener('touchend', event => {
  if (scriptMode !== 'step' || touchStartY === null || !currentSpeech) return;

  const delta = event.changedTouches[0].clientY - touchStartY;
  touchStartY = null;

  if (Math.abs(delta) < 45) return;

  const direction = delta < 0 ? 1 : -1;

  if (!stepAreaCanScroll(direction)) {
    moveStep(direction);
  }
}, { passive: true });

app.addEventListener('wheel', event => {
  if (scriptMode !== 'step' || !currentSpeech) return;

  const direction = event.deltaY > 0 ? 1 : -1;

  if (stepAreaCanScroll(direction)) {
    return;
  }

  event.preventDefault();

  if (wheelLocked) return;

  wheelAccumulator += event.deltaY;

  if (Math.abs(wheelAccumulator) < 20) return;

  wheelLocked = true;
  wheelAccumulator = 0;
  moveStep(direction);

  setTimeout(() => {
    wheelLocked = false;
  }, 280);
}, { passive: false });

document.addEventListener('keydown', event => {
  if (scriptMode !== 'step' || !currentSpeech) return;

  let direction = 0;

  if (['ArrowDown','ArrowRight','PageDown',' '].includes(event.key)) {
    direction = 1;
  } else if (['ArrowUp','ArrowLeft','PageUp'].includes(event.key)) {
    direction = -1;
  }

  if (!direction) return;

  if (stepAreaCanScroll(direction)) return;

  event.preventDefault();
  moveStep(direction);
});

window.addEventListener('resize', updateTopHeight);

back.addEventListener('click', () => {

  document.body.classList.remove('step-active');
  scriptMode = 'flow';
  renderBeats();

  window.scrollTo(0, 0);

});

fetch('data.json')

  .then(response => {

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    return response.json();

  })

  .then(json => {

    data = json;

    renderChips();
    updateTopHeight();

    renderBeats();

  })

  .catch(error => {

    console.error(error);

    app.innerHTML =
      `<div class="status">
        Couldn't load data.json.
      </div>`;

  });

</script>

</body>
</html>
