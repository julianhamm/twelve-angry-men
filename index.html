<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Twelve Angry Men</title>

<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fffdf8;
    --ink: #24211d;
    --muted: #777169;
    --line: #d9d3ca;
    --accent: #8b2e2e;
    --chip: #e8e3da;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  button {
    font: inherit;
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(244,241,234,.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }

  .top-inner,
  main {
    width: min(100%, 760px);
    margin: auto;
  }

  .title-row {
    min-height: 54px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 6px;
  }

  h1 {
    font-size: 18px;
    letter-spacing: .08em;
    margin: 0;
    flex: 1;
  }

  .back {
    display: none;
    border: 0;
    background: transparent;
    padding: 6px 4px;
    font-weight: 700;
    cursor: pointer;
  }

  .back.show {
    display: block;
  }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 14px 10px;
  }

  .chips::-webkit-scrollbar {
    display: none;
  }

  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 10px;
    min-width: 38px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .chip.active {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }

  main {
    padding: 14px;
  }

  .beat-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: opacity .15s ease, transform .15s ease;
  }

  .beat-card:active {
    transform: scale(.995);
  }

  .beat-card.dimmed {
    opacity: .28;
  }

  .beat-number {
    color: var(--accent);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .beat-meta {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .beat-title {
    margin: 0 0 6px;
    font-size: 19px;
    line-height: 1.18;
  }

  .beat-summary {
    margin: 0 0 12px;
    color: #504b45;
    font-size: 14px;
    line-height: 1.42;
  }

  .participation {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 3px;
  }

  .part {
    position: relative;
    height: 30px;
    border-radius: 5px;
    background: #ebe7e0;
    overflow: hidden;
    display: grid;
    place-items: center;
    color: #aaa39a;
    font-size: 10px;
    font-weight: 800;
  }

  .part .fill {
    position: absolute;
    inset: auto 0 0;
    background: var(--accent);
    opacity: .18;
  }

  .part.present {
    color: var(--ink);
  }

  .part.selected {
    outline: 2px solid var(--ink);
    outline-offset: -2px;
  }

  .part span {
    position: relative;
    z-index: 1;
  }

  .script-head {
    padding: 4px 2px 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }

  .script-head h2 {
    margin: 0 0 6px;
    font-size: 23px;
  }

  .script-head p {
    margin: 0;
    color: var(--muted);
    line-height: 1.4;
  }

  .speech {
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    border-radius: 8px;
  }

  .speech.mine {
    background: #f1e1df;
  }

  .speaker {
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .speech-text {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.48;
  }

  .view-mode {
    display: flex;
    width: fit-content;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: 0 0 14px;
    background: var(--chip);
  }

  .mode-button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .mode-button.active {
    background: var(--ink);
    color: white;
  }

  body.step-mode {
    scroll-snap-type: y proximity;
  }

  body.step-mode .speech {
    scroll-snap-align: start;
    scroll-margin-top: 104px;
  }

  .beat-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 24px 0 10px;
  }

  .beat-nav-button {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    box-shadow: var(--shadow);
  }

  .beat-nav-button.next {
    text-align: right;
  }

  .beat-nav-button.empty {
    visibility: hidden;
  }

  .beat-nav-direction {
    display: block;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .beat-nav-title {
    display: block;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.25;
  }

  .character-info {
    flex: 0 0 auto;
    display: none;
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    font-weight: 800;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  .character-info.show {
    display: inline-flex;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,.42);
    padding: 16px;
  }

  .modal-backdrop.show {
    display: flex;
  }

  .modal {
    width: min(100%, 560px);
    background: var(--paper);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.22);
    padding: 18px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .modal h2 {
    margin: 0;
    flex: 1;
    font-size: 22px;
  }

  .modal p {
    margin: 12px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.5;
  }

  .modal-close {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 26px;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
  }

  .status {
    padding: 30px 14px;
    text-align: center;
    color: var(--muted);
  }

  @media (min-width: 700px) {
    main {
      padding-top: 20px;
    }

    .beat-card {
      padding: 18px;
    }

    .beat-title {
      font-size: 21px;
    }

    .beat-summary {
      font-size: 15px;
    }
  }
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">

    <div class="title-row">
      <button id="back" class="back" aria-label="Back to beats">←</button>
      <h1>TWELVE ANGRY MEN</h1>
      <button id="characterInfo" class="character-info" aria-label="Character information">ⓘ</button>
    </div>

    <nav id="chips" class="chips" aria-label="Character selection"></nav>

  </div>
</header>

<main id="app">
  <div class="status">Loading play…</div>
</main>

<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-top">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="modal-close" aria-label="Close">×</button>
    </div>
    <p id="modalSummary"></p>
  </section>
</div>

<script>

const app = document.getElementById('app');
const chips = document.getElementById('chips');
const back = document.getElementById('back');
const characterInfo = document.getElementById('characterInfo');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalClose = document.getElementById('modalClose');
const modalTitle = document.getElementById('modalTitle');
const modalSummary = document.getElementById('modalSummary');

let data;
let selected = 'ALL';
let currentBeat = null;
let scriptMode = 'flow';

const jurors = [
  ['Foreman','F'],
  ['2nd Juror','2'],
  ['3rd Juror','3'],
  ['4th Juror','4'],
  ['5th Juror','5'],
  ['6th Juror','6'],
  ['7th Juror','7'],
  ['8th Juror','8'],
  ['9th Juror','9'],
  ['10th Juror','10'],
  ['11th Juror','11'],
  ['12th Juror','12']
];

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  })[c]);
}

function beatMeta(beat) {

  const act =
    beat.act === 1
      ? 'Act One'
      : 'Act Two';

  const pages =
    beat.start_page === beat.end_page
      ? `Page ${beat.start_page}`
      : `Pages ${beat.start_page}–${beat.end_page}`;

  return `${act} · ${pages}`;
}

function renderChips() {

  const choices = [
    ['ALL','ALL'],
    ...jurors.map(([name,label]) => [
      name,
      name === 'Foreman' ? 'F' : 'J' + label
    ])
  ];

  chips.innerHTML = choices.map(([name,label]) =>
    `<button
      class="chip ${selected === name ? 'active' : ''}"
      data-name="${name}">
      ${label}
    </button>`
  ).join('');

  characterInfo.classList.toggle('show', selected !== 'ALL');

  chips.querySelectorAll('.chip').forEach(btn => {

    btn.addEventListener('click', () => {

      selected = btn.dataset.name;

      renderChips();

      currentBeat
        ? renderScript(currentBeat)
        : renderBeats();

    });

  });

}

function speechesForBeat(id) {
  return data.script.filter(s => s.beat === id);
}

function countsForBeat(id) {

  const counts =
    Object.fromEntries(
      jurors.map(([name]) => [name, 0])
    );

  for (const speech of speechesForBeat(id)) {

    if (speech.speaker in counts) {
      counts[speech.speaker]++;
    }

  }

  return counts;
}

function renderParticipation(beatId) {

  const counts = countsForBeat(beatId);

  const max =
    Math.max(
      1,
      ...Object.values(counts)
    );

  return `
    <div class="participation">

      ${jurors.map(([name,label]) => {

        const count = counts[name];

        const height =
          count
            ? Math.max(
                18,
                Math.round((count / max) * 100)
              )
            : 0;

        const classes = [
          'part',
          count ? 'present' : '',
          selected === name ? 'selected' : ''
        ]
        .filter(Boolean)
        .join(' ');

        return `
          <div
            class="${classes}"
            title="${escapeHTML(name)}: ${count} speeches">

            <div
              class="fill"
              style="height:${height}%">
            </div>

            <span>${label}</span>

          </div>
        `;

      }).join('')}

    </div>
  `;
}

function renderBeats() {

  currentBeat = null;
  document.body.classList.remove('step-mode');

  back.classList.remove('show');

  app.innerHTML =
    data.beats.map(beat => {

      const counts =
        countsForBeat(beat.id);

      const dimmed =
        selected !== 'ALL'
        && !counts[selected];

      return `
        <article
          class="beat-card ${dimmed ? 'dimmed' : ''}"
          data-beat="${beat.id}">

          <div class="beat-number">
            Beat ${beat.id}
          </div>

          <div class="beat-meta">
            ${beatMeta(beat)}
          </div>

          <h2 class="beat-title">
            ${escapeHTML(beat.title)}
          </h2>

          <p class="beat-summary">
            ${escapeHTML(beat.summary)}
          </p>

          ${renderParticipation(beat.id)}

        </article>
      `;

    }).join('');

  app.querySelectorAll('.beat-card')
    .forEach(card => {

      card.addEventListener('click', () => {

        const id =
          Number(card.dataset.beat);

        renderScript(id);

        window.scrollTo(0, 0);

      });

    });

}

function renderModeControl() {
  return `
    <div class="view-mode" aria-label="Script navigation mode">
      <button
        class="mode-button ${scriptMode === 'flow' ? 'active' : ''}"
        data-mode="flow">
        Flow
      </button>
      <button
        class="mode-button ${scriptMode === 'step' ? 'active' : ''}"
        data-mode="step">
        Step
      </button>
    </div>
  `;
}

function currentSpeechId() {

  const speeches = [...app.querySelectorAll('.speech[data-speech-id]')];

  if (!speeches.length) return null;

  const targetY = 115;
  let closest = speeches[0];
  let closestDistance = Infinity;

  for (const speech of speeches) {
    const rect = speech.getBoundingClientRect();
    const distance = Math.abs(rect.top - targetY);

    if (distance < closestDistance) {
      closest = speech;
      closestDistance = distance;
    }
  }

  return Number(closest.dataset.speechId);
}

function setScriptMode(mode) {

  if (!currentBeat || mode === scriptMode) return;

  const speechId = currentSpeechId();
  scriptMode = mode;

  document.body.classList.toggle('step-mode', scriptMode === 'step');

  app.querySelectorAll('.mode-button').forEach(button => {
    button.classList.toggle('active', button.dataset.mode === scriptMode);
  });

  if (speechId !== null) {
    requestAnimationFrame(() => {
      const speech = app.querySelector(`[data-speech-id="${speechId}"]`);
      if (speech) {
        speech.scrollIntoView({
          block: 'start',
          behavior: 'auto'
        });
      }
    });
  }
}

function renderBeatNavigation(beatId) {

  const index = data.beats.findIndex(beat => beat.id === beatId);
  const previous = index > 0 ? data.beats[index - 1] : null;
  const next = index < data.beats.length - 1 ? data.beats[index + 1] : null;

  const previousButton = previous
    ? `
      <button class="beat-nav-button" data-beat="${previous.id}">
        <span class="beat-nav-direction">← Previous beat</span>
        <span class="beat-nav-title">${escapeHTML(previous.title)}</span>
      </button>
    `
    : `<div class="beat-nav-button empty" aria-hidden="true"></div>`;

  const nextButton = next
    ? `
      <button class="beat-nav-button next" data-beat="${next.id}">
        <span class="beat-nav-direction">Next beat →</span>
        <span class="beat-nav-title">${escapeHTML(next.title)}</span>
      </button>
    `
    : `<div class="beat-nav-button empty" aria-hidden="true"></div>`;

  return `
    <nav class="beat-nav" aria-label="Beat navigation">
      ${previousButton}
      ${nextButton}
    </nav>
  `;
}

function openCharacterModal() {

  if (selected === 'ALL') return;

  const character = data.characters.find(
    character => character.name === selected
  );

  if (!character) return;

  modalTitle.textContent = character.name;
  modalSummary.textContent = character.summary;
  modalBackdrop.classList.add('show');
  modalBackdrop.setAttribute('aria-hidden', 'false');
}

function closeCharacterModal() {
  modalBackdrop.classList.remove('show');
  modalBackdrop.setAttribute('aria-hidden', 'true');
}

function renderScript(beatId) {

  currentBeat = beatId;

  back.classList.add('show');

  const beat =
    data.beats.find(
      beat => beat.id === beatId
    );

  const speeches =
    speechesForBeat(beatId);

  app.innerHTML = `

    <section class="script-head">

      ${renderModeControl()}

      <div class="beat-number">
        Beat ${beat.id}
      </div>

      <div class="beat-meta">
        ${beatMeta(beat)}
      </div>

      <h2>
        ${escapeHTML(beat.title)}
      </h2>

      <p>
        ${escapeHTML(beat.summary)}
      </p>

    </section>

    <section>

      ${speeches.map(speech => `

        <article
          data-speech-id="${speech.id}"
          class="speech ${
            selected !== 'ALL'
            && speech.speaker === selected
              ? 'mine'
              : ''
          }">

          <div class="speaker">
            ${escapeHTML(speech.speaker)}
          </div>

          <div class="speech-text">
            ${escapeHTML(speech.text)}
          </div>

        </article>

      `).join('')}

    </section>

    ${renderBeatNavigation(beatId)}
  `;

  document.body.classList.toggle('step-mode', scriptMode === 'step');

  app.querySelectorAll('.mode-button')
    .forEach(button => {
      button.addEventListener('click', () => {
        setScriptMode(button.dataset.mode);
      });
    });

  app.querySelectorAll('.beat-nav-button[data-beat]')
    .forEach(button => {
      button.addEventListener('click', () => {
        renderScript(Number(button.dataset.beat));
        window.scrollTo(0, 0);
      });
    });
}

characterInfo.addEventListener('click', openCharacterModal);

modalClose.addEventListener('click', closeCharacterModal);

modalBackdrop.addEventListener('click', event => {
  if (event.target === modalBackdrop) {
    closeCharacterModal();
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closeCharacterModal();
  }
});

back.addEventListener('click', () => {

  renderBeats();

  window.scrollTo(0, 0);

});

fetch('data.json')

  .then(response => {

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    return response.json();

  })

  .then(json => {

    data = json;

    renderChips();

    renderBeats();

  })

  .catch(error => {

    console.error(error);

    app.innerHTML =
      `<div class="status">
        Couldn't load data.json.
      </div>`;

  });

</script>

</body>
</html>
